<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabs</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">

        <div class="tabs">
            <button id="firstTab" class="current" data-content="firstContent">First Tab</button>
            <button id="secondTab" data-content="secondContent">Second Tab</button>
            <button id="thirdTab" data-content="thirdContent">Third Tab</button>
            <button id="fourthTab" data-content="fourthContent">Fourth Tab</button>
        </div>


            <div id="firstContent" class="tab-content">
                <p>First Tab content to be displayed here.</p>
            </div>
            
            <div id="secondContent" class="tab-content">
                <p>Second Tab content to be displayed here.</p>
            </div>
            
            <div id="thirdContent" class="tab-content">
                <p>Third Tab content to be displayed here.</p>
            </div>
            
            <div id="fourthContent" class="tab-content">
                <p>Fourth Tab content to be displayed here.</p>
            </div>

            <p class="bottom-content">And some dummy content at the bottom</p>
    </div>
        
    <script src="style.js"></script>
</body>
</html>
